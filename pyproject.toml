[project]
name = "pihero-dev"
version = "0.0.0"
description = "Development environment for Pi Hero packages and their tests"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["testkit"]

[tool.uv.sources]
pihero-testkit = { workspace = true }

[dependency-groups]
dev = ["pihero-testkit"]

[tool.pytest.ini_options]
testpaths = ["packages", "testkit/tests"]
# testinfra's own plugin registers after ours and its local-host `host` fixture would shadow the target's.
addopts = "-p pihero_testkit.plugin -p no:pytest11.testinfra --import-mode=importlib -ra"
