name: kaomoji
arch: all
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Björn Kahlert <bkahlert@users.noreply.github.com>
description: |
  The Pi Hero cast: three animated kaomoji for the terminal.
  hero, wizard, and visitor print one face each, static or animated, plain or colored, in every mood they have.
homepage: https://github.com/bkahlert/pihero
license: MIT
depends:
  - bash (>= 5.0)
contents:
  - src: kaomoji.bash
    dst: /usr/lib/kaomoji/kaomoji.bash
    file_info:
      mode: 0644
  - src: hero
    dst: /usr/bin/hero
    file_info:
      mode: 0755
  - src: wizard
    dst: /usr/bin/wizard
    file_info:
      mode: 0755
  - src: visitor
    dst: /usr/bin/visitor
    file_info:
      mode: 0755
